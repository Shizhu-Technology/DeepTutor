<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepTutor 语音对话</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: #1e293b;
      background: #f1f5f9;
    }
    h1 { text-align: center; margin: 10px 0; }
    .status {
      text-align: center;
      color: #64748b;
      min-height: 24px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    #chat {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      min-height: 260px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    .msg-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .msg.user .msg-label { color: #bfdbfe; }
    .panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    button {
      padding: 14px 32px;
      border: none;
      border-radius: 9999px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    button.secondary {
      padding: 8px 16px;
      background: #f1f5f9;
      color: #475569;
      box-shadow: none;
      border: 1px solid #e2e8f0;
      font-size: 13px;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
    button.recording { background: #dc2626; }
    #result { display: none; margin-top: 12px; }
    audio { width: 100%; }
    .hint {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>DeepTutor 语音对话</h1>
  <p class="status" id="status">点击录音，向 AI 助教提问</p>

  <div id="chat"></div>

  <div class="panel">
    <button id="recordBtn" type="button">按住说话 / 点击开始</button>
    <button id="clearBtn" class="secondary" type="button">清空对话</button>
  </div>

  <div id="result">
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <p class="hint">
    后端：<code id="backendAddr">http://localhost:8001</code> &nbsp;|&nbsp;
    UI 端口：<code id="uiPort">8080</code>
  </p>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const chatEl = document.getElementById('chat');
    const resultEl = document.getElementById('result');
    const audioPlayer = document.getElementById('audioPlayer');
    const backendAddrEl = document.getElementById('backendAddr');
    const uiPortEl = document.getElementById('uiPort');

    fetch('/_info').then(r => r.json()).then(info => {
      backendAddrEl.textContent = info.backend_url;
      uiPortEl.textContent = info.ui_port;
    }).catch(() => {});

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let sessionId = '';

    function appendMessage(role, html) {
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + role;
      const label = role === 'user' ? '我（语音转文字）' : 'AI 助教';
      wrapper.innerHTML = '<div class="msg-label">' + label + '</div>' + html;
      chatEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrapper;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    async function startRecording() {
      audioChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const preferredTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      let selectedType = '';
      for (const t of preferredTypes) { if (MediaRecorder.isTypeSupported(t)) { selectedType = t; break; } }
      mediaRecorder = new MediaRecorder(stream, selectedType ? { mimeType: selectedType } : undefined);
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        sendTextThenAudio(new Blob(audioChunks, { type: mimeType }), mimeType);
      };
      mediaRecorder.start(200);
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '点击结束录音';
      statusEl.textContent = '正在录音，请说话…';
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      isRecording = false;
      recordBtn.disabled = true;
      appendMessage('user', '<i>🎤 语音消息</i>');
      statusEl.textContent = '正在识别语音…';
      mediaRecorder.stop();
    }

    async function sendTextThenAudio(blob, mimeType) {
      const form = new FormData();
      const ext = mimeType.includes('mp4') ? 'm4a' : (mimeType.includes('webm') ? 'webm' : 'bin');
      form.append('audio', blob, `recording.${ext}`);
      form.append('persona', 'tutor');
      if (sessionId) form.append('session_id', sessionId);

      try {
        // 1. STT + chat text
        const resp = await fetch('/voice/chat/text', { method: 'POST', body: form });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
        const data = await resp.json();
        sessionId = data.session_id || sessionId;

        chatEl.lastElementChild.outerHTML = '';
        appendMessage('user', escapeHtml(data.transcript));
        appendMessage('assistant', escapeHtml(data.reply));
        statusEl.textContent = '回复已显示，正在合成语音…';

        // 2. 单独合成语音并播放
        const ttsResp = await fetch('/voice/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: data.reply }),
        });
        if (!ttsResp.ok) throw new Error(`TTS HTTP ${ttsResp.status}: ${await ttsResp.text()}`);
        const audioBlob = await ttsResp.blob();
        audioPlayer.src = URL.createObjectURL(audioBlob);
        resultEl.style.display = 'block';
        statusEl.textContent = '完成';
      } catch (err) {
        statusEl.textContent = '出错：' + err.message;
        console.error(err);
      } finally {
        recordBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '按住说话 / 点击开始';
      }
    }

    recordBtn.addEventListener('click', () => { if (isRecording) stopRecording(); else startRecording(); });
    clearBtn.addEventListener('click', () => { chatEl.innerHTML = ''; sessionId = ''; statusEl.textContent = '已清空'; });
  </script>
</body>
</html>
