<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepTutor Voice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      margin: 0;
      color: #1e293b;
      background: #f8fafc;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    input#backendUrl {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 36px;
    }
    #recordBtn {
      width: 170px;
      height: 170px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
      user-select: none;
      touch-action: manipulation;
    }
    #recordBtn:active, #recordBtn.recording {
      background: #dc2626;
      transform: scale(0.98);
    }
    #recordBtn:disabled {
      background: #94a3b8;
      box-shadow: none;
    }
    #status {
      margin-top: 24px;
      color: #64748b;
      font-size: 15px;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <input id="backendUrl" type="text" value="http://YOUR_PC_IP:8001" placeholder="后端地址">
    <button id="recordBtn">按住说话</button>
    <div id="status">按住按钮开始录音</div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const backendInput = document.getElementById('backendUrl');
    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');
    const audioPlayer = document.getElementById('audioPlayer');
    let mediaRecorder;
    let chunks = [];
    let isRecording = false;
    let sessionId = '';

    backendInput.value = localStorage.getItem('dt_backend_url') || backendInput.value;
    backendInput.addEventListener('change', () => localStorage.setItem('dt_backend_url', backendInput.value));

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function startRecording() {
      chunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
      let type = '';
      for (const t of types) if (MediaRecorder.isTypeSupported(t)) { type = t; break; }
      mediaRecorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        sendAudio(new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
      };
      mediaRecorder.start(200);
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '松开结束';
      statusEl.textContent = '正在录音…';
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      isRecording = false;
      recordBtn.disabled = true;
      recordBtn.classList.remove('recording');
      statusEl.textContent = '正在发送…';
      mediaRecorder.stop();
    }

    async function sendAudio(blob) {
      const backendUrl = backendInput.value.replace(/\/$/, '');
      try {
        const b64 = await blobToBase64(blob);
        statusEl.textContent = '正在识别与思考…';
        const resp = await fetch(`${backendUrl}/api/voice/chat/base64`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audio_base64: b64, persona: 'tutor', session_id: sessionId }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
        const data = await resp.json();
        sessionId = data.session_id || sessionId;
        statusEl.textContent = '完成';
        audioPlayer.src = `data:${data.audio_content_type};base64,${data.audio_base64}`;
        audioPlayer.play();
      } catch (err) {
        statusEl.textContent = '出错：' + err.message;
        console.error(err);
      } finally {
        recordBtn.disabled = false;
        recordBtn.textContent = '按住说话';
      }
    }

    recordBtn.addEventListener('touchstart', e => { e.preventDefault(); if (!isRecording) startRecording(); });
    recordBtn.addEventListener('touchend', e => { e.preventDefault(); if (isRecording) stopRecording(); });
    recordBtn.addEventListener('mousedown', e => { e.preventDefault(); if (!isRecording) startRecording(); });
    recordBtn.addEventListener('mouseup', e => { e.preventDefault(); if (isRecording) stopRecording(); });
  </script>
</body>
</html>
