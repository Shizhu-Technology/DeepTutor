<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DeepTutor Voice</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      margin: 0;
      color: #1e293b;
      background: #f8fafc;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    input[type="text"] {
      width: 100%;
      max-width: 360px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input[type="file"] {
      display: none;
    }
    #pickBtn {
      padding: 16px 40px;
      border: none;
      border-radius: 9999px;
      background: #2563eb;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
    }
    #pickBtn:active { transform: scale(0.98); }
    #pickBtn:disabled { background: #94a3b8; box-shadow: none; }
    #status {
      margin-top: 24px;
      color: #64748b;
      font-size: 15px;
      min-height: 24px;
      text-align: center;
    }
    #textResult {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 24px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    #textResult p { margin: 8px 0; }
    .label { color: #64748b; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <input id="backendUrl" type="text" value="http://YOUR_PC_IP:8001" placeholder="后端地址">
    <input id="audioInput" type="file" accept="audio/*">
    <button id="pickBtn">选择音频文件</button>
    <div id="status">点击按钮选择音频</div>
    <div id="textResult">
      <p><span class="label">识别：</span><span id="transcript"></span></p>
      <p><span class="label">回复：</span><span id="reply"></span></p>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const backendInput = document.getElementById('backendUrl');
    const audioInput = document.getElementById('audioInput');
    const pickBtn = document.getElementById('pickBtn');
    const statusEl = document.getElementById('status');
    const textResult = document.getElementById('textResult');
    const transcriptEl = document.getElementById('transcript');
    const replyEl = document.getElementById('reply');
    const audioPlayer = document.getElementById('audioPlayer');
    let sessionId = '';

    backendInput.value = localStorage.getItem('dt_backend_url') || backendInput.value;
    backendInput.addEventListener('change', () => localStorage.setItem('dt_backend_url', backendInput.value));

    pickBtn.addEventListener('click', () => audioInput.click());

    audioInput.addEventListener('change', async () => {
      const file = audioInput.files[0];
      if (!file) return;
      await processFile(file);
      audioInput.value = '';
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function processFile(file) {
      const backendUrl = backendInput.value.replace(/\/$/, '');
      pickBtn.disabled = true;
      statusEl.textContent = '正在发送音频…';
      try {
        const b64 = await fileToBase64(file);
        statusEl.textContent = '正在识别与思考…';
        const resp = await fetch(`${backendUrl}/api/voice/chat/base64`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audio_base64: b64,
            persona: 'tutor',
            session_id: sessionId,
          }),
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
        const data = await resp.json();
        sessionId = data.session_id || sessionId;

        transcriptEl.textContent = data.transcript;
        replyEl.textContent = data.reply;
        textResult.style.display = 'block';
        statusEl.textContent = '完成';

        audioPlayer.src = `data:${data.audio_content_type};base64,${data.audio_base64}`;
        audioPlayer.play();
      } catch (err) {
        statusEl.textContent = '出错：' + err.message;
        console.error(err);
      } finally {
        pickBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
